services:
  - type: web
    name: arustren-realtime
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /data/arustren.sqlite
    disk:
      name: arustren-data
      mountPath: /data
      sizeGB: 1